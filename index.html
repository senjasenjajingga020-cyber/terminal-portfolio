<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theodore | Terminal Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- BOOT SCREEN -->
    <div id="boot-screen">
        <div id="boot-text"></div>
    </div>

    <!-- TERMINAL -->
    <main class="terminal">

        <!-- HEADER -->
        <header class="terminal-header">

            <div class="window-buttons">
                <span class="close"></span>
                <span class="minimize"></span>
                <span class="maximize"></span>
            </div>

            <div class="terminal-title">
                theodore@portfolio: ~
            </div>

        </header>


        <!-- TERMINAL CONTENT -->
        <section
            id="terminal-output"
            class="terminal-output"
        >

            <div class="welcome">
                <p>
                    Welcome to
                    <strong>Theodore's Terminal Portfolio</strong>
                </p>

                <p>
                    Type
                    <span class="command">help</span>
                    to see available commands.
                </p>
            </div>

        </section>


        <!-- INPUT -->
        <form
            id="terminal-form"
            class="terminal-input"
        >

            <span class="prompt">
                theodore@portfolio:~$
            </span>

            <input
                id="command-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                autofocus
            >

        </form>

    </main>


    <script src="js/terminal.js"></script>

</body>
</html>
