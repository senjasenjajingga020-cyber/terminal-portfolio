<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Theodore | Terminal Portfolio</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ========================================
           PAGE
        ======================================== */

        body {
            position: relative;
            min-height: 100vh;
            overflow: hidden;

            background: #05070a;
        }


        /* ========================================
           ANIME BACKGROUND
        ======================================== */

        .anime-background {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            object-fit: fill;
            object-position: center;

            z-index: 0;

            filter: brightness(0.65);
        }


        /* ========================================
           DARK OVERLAY
        ======================================== */

        .anime-overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.20);

            z-index: 1;

            pointer-events: none;
        }


        /* ========================================
           TERMINAL
        ======================================== */

        .terminal {
            position: relative;

            z-index: 2;
        }


        /* ========================================
           BOOT SCREEN
        ======================================== */

        #boot-screen {
            position: fixed;

            inset: 0;

            z-index: 9999;
        }
    </style>
</head>


<body>

    <!-- ========================================
         ANIME BACKGROUND
    ======================================== -->

    <img
        src="anime.jpg"
        alt=""
        class="anime-background"
    >

    <div class="anime-overlay"></div>


    <!-- ========================================
         BOOT SCREEN
    ======================================== -->

    <div id="boot-screen">

        <div id="boot-text"></div>

    </div>


    <!-- ========================================
         TERMINAL
    ======================================== -->

    <main class="terminal">

        <!-- HEADER -->

        <header class="terminal-header">

            <div class="window-buttons">

                <span class="close"></span>

                <span class="minimize"></span>

                <span class="maximize"></span>

            </div>


            <div class="terminal-title">
                theodore@portfolio: ~
            </div>

        </header>


        <!-- TERMINAL OUTPUT -->

        <section
            id="terminal-output"
            class="terminal-output"
        >

            <div class="welcome">

                <p>
                    Welcome to
                    <strong>
                        Theodore's Terminal Portfolio
                    </strong>
                </p>

                <p>
                    Type
                    <span class="command">
                        help
                    </span>
                    to see available commands.
                </p>

            </div>

        </section>


        <!-- TERMINAL INPUT -->

        <form
            id="terminal-form"
            class="terminal-input"
        >

            <span class="prompt">
                theodore@portfolio:~$
            </span>

            <input
                id="command-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                autofocus
            >

        </form>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/terminal.js"></script>

</body>

</html>
